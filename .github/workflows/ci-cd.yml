name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-check:
    name: Build Assets & Dependency Check (CI)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, bcmath, sqlite3
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: Prepare Environment & App Key
      run: |
        cp .env.example .env
        php artisan key:generate

  deploy:
    name: Deploy to Production VPS (CD)
    runs-on: ubuntu-latest
    needs: [build-and-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy via SSH & Docker Compose
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        password: ${{ secrets.PROD_PASSWORD }}
        port: ${{ secrets.PROD_PORT || 22 }}
        script: |
          cd /var/www/sisfo-kobarin
          git pull origin main
          docker compose up -d --build
          docker compose exec -T app composer install --no-dev --optimize-autoloader --no-interaction
          docker compose exec -T app npm ci
          docker compose exec -T app npm run build
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache
          docker compose exec -T app php artisan view:cache
